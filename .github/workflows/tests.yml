name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -e ".[dev]"

      - run: python tests/test_proxy_e2e.py
      - run: python tests/test_tail_follow.py
      - run: python tests/test_npx_server.py
      - run: python tests/test_stats.py
      - run: python tests/test_http_proxy.py
      - run: python tests/test_http_proxy_edge_cases.py
      - run: python tests/test_sse_buffer_fuzz.py
      - run: python tests/test_record_non_dict_json.py
      - run: python tests/test_record_fuzz.py
      - run: python tests/test_tool_error_extraction.py
      - run: python tests/test_wrap.py
      - run: python tests/test_serve.py
      - run: python tests/test_corrupted_log_line.py
