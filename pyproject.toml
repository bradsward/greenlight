[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenlight-mcp"
version = "0.3.0"
description = "See what your MCP server is actually doing -- a transparent stdio/HTTP proxy and live trace viewer for the Model Context Protocol."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "mcp-inspector", "debugging", "proxy", "cli", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/bradsward/greenlight"
Issues = "https://github.com/bradsward/greenlight/issues"

[project.optional-dependencies]
dev = [
    "mcp>=1.0",
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
    "hypothesis>=6.0",
]

[project.scripts]
greenlight = "greenlight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
